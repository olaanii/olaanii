<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
  <title id="title">Olani's GitHub activity</title>
  <desc id="desc">A black and white activity chart that fills with public GitHub contribution data when the profile update workflow runs.</desc>
  <rect width="1000" height="570" rx="14" fill="#000"/>
  <g fill="#fff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="28" y="38" font-size="13" letter-spacing="1.5">ACTIVITY</text>
    <text x="28" y="74" font-size="18">Loading public GitHub activity…</text>
    <text x="28" y="106" fill="#aaa" font-size="13">This graphic will populate automatically after the profile workflow runs.</text>
  </g>
  <g stroke="#555" stroke-dasharray="4 5">
