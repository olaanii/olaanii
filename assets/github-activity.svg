    <text x="28" y="394">CURRENT STREAK</text><text x="360" y="394">LONGEST STREAK</text><text x="694" y="394">BEST WEEK</text>
    <text x="28" y="452">BY WEEKDAY</text><text x="354" y="452">LANGUAGES</text>
