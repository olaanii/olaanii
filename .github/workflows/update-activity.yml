name: Update profile activity

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/generate-activity.mjs
      - .github/workflows/update-activity.yml
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate activity graphic
        run: node scripts/generate-activity.mjs
      - name: Commit updated graphic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity.svg
          if git diff --cached --quiet; then
            echo "Activity graphic is already current."
          else
            git commit -m "Update GitHub activity graphic"
            git push
          fi
